<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Canvas Image Converter - Auto Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        #preview {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Processing Image...</h1>
        <div class="loading">
            <div class="spinner"></div>
        </div>
        <div class="status info" id="status">Initializing...</div>
        <canvas id="preview" style="display: none;"></canvas>
        <div id="output"></div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const imageUrl = urlParams.get('img');
        const width = parseInt(urlParams.get('w')) || 700;
        const height = parseInt(urlParams.get('h')) || 700;
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }
        
        async function processImage() {
            try {
                if (!imageUrl) {
                    updateStatus('No image URL provided in parameters', 'error');
                    return;
                }
                
                updateStatus('Loading image from URL...', 'info');
                
                // Load image
                const img = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.crossOrigin = 'Anonymous';
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error('Failed to load image'));
                    image.src = imageUrl;
                });
                
                updateStatus(`Processing ${width}x${height} image...`, 'info');
                
                // Create canvas and resize
                const canvas = document.getElementById('preview');
                const ctx = canvas.getContext('2d');
                
                canvas.width = width;
                canvas.height = height;
                canvas.style.display = 'block';
                
                // Nearest neighbor for pixel art
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, 0, 0, width, height);
                
                // Get pixel data
                const imageData = ctx.getImageData(0, 0, width, height);
                const pixels = imageData.data;
                
                const outputData = [];
                
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    outputData.push(`${r},${g},${b}`);
                }
                
                const finalString = outputData.join(';');
                
                // Display result in a hidden div that Lua can read
                const outputDiv = document.getElementById('output');
                outputDiv.textContent = finalString;
                outputDiv.style.display = 'block';
                
                // Also store in window for easy access
                window.CONVERSION_RESULT = finalString;
                window.CONVERSION_COMPLETE = true;
                
                updateStatus(
                    `✅ Success! Processed ${outputData.length} pixels. Result ready for Lua script.`,
                    'success'
                );
                
                // Signal completion via title change (Lua can detect this)
                document.title = 'CONVERSION_COMPLETE';
                
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, 'error');
                window.CONVERSION_ERROR = error.message;
                document.title = 'CONVERSION_ERROR';
                console.error(error);
            }
        }
        
        // Auto-start processing when page loads
        if (imageUrl) {
            processImage();
        } else {
            updateStatus('⚠️ Manual mode: Please provide image URL via ?img=URL&w=WIDTH&h=HEIGHT', 'error');
        }
    </script>
</body>
</html>
