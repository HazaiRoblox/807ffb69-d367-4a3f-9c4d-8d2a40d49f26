<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Matrix | Image to RGB</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* Sections */
        .section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        h3 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Custom File Input */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 100px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0,0,0,0.2);
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }
        
        .file-upload-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        /* Buttons */
        button {
            cursor: pointer;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #processBtn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        #processBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .secondary-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            flex: 1;
        }

        .secondary-btn:hover {
            background: var(--border);
        }

        /* Preview Area */
        .preview-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .canvas-wrapper {
            background: #000;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-wrapper p {
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; /* Keeps pixels sharp */
        }

        /* Output Area */
        textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #a5d6ff;
            font-family: 'JetBrains Mono', monospace;
            padding: 15px;
            font-size: 0.8rem;
            resize: vertical;
            margin-bottom: 10px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        #status {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--success);
            min-height: 1.2em;
        }

        .or-divider {
            text-align: center;
            margin: 15px 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            position: relative;
        }
        
        .or-divider::before, .or-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--border);
        }
        .or-divider::before { left: 0; }
        .or-divider::after { right: 0; }

    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-layer-group"></i> Pixel Matrix</h1>

        <!-- 1. Input Section -->
        <div class="section">
            <h3>1. Source Image</h3>
            
            <div class="file-upload-wrapper">
                <i class="fa-solid fa-cloud-arrow-up file-upload-icon"></i>
                <span class="file-upload-text" id="fileNameDisplay">Click or Drag image here</span>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="or-divider">OR USE URL</div>

            <input type="text" id="urlInput" placeholder="https://example.com/image.png">
        </div>

        <!-- 2. Configuration Section -->
        <div class="section">
            <h3>2. Configuration</h3>
            <div>
                <label>Color Palette Size (K-Means)</label>
                <input type="text" id="colorAmount" value="full" placeholder="e.g. 16, 32 or 'full'">
                <small style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 5px;">
                    Type 'full' for original colors, or a number to reduce colors.
                </small>
            </div>
            <br>
            <button id="processBtn"><i class="fa-solid fa-microchip"></i> Process Image</button>
            <span id="status"></span>
        </div>

        <!-- 3. Preview Section -->
        <div class="section">
            <h3>3. Preview</h3>
            <div class="preview-container">
                <div class="canvas-wrapper">
                    <p>Original</p>
                    <canvas id="canvasSource"></canvas>
                </div>
                <div class="canvas-wrapper">
                    <p>Processed Result</p>
                    <canvas id="canvasResult"></canvas>
                </div>
            </div>
        </div>

        <!-- 4. Output Section -->
        <div class="section">
            <h3>4. RGB String Output</h3>
            <textarea id="outputCode" rows="6" readonly placeholder="R,G,B;R,G,B..."></textarea>
            <div class="action-buttons">
                <button id="copyBtn" class="secondary-btn"><i class="fa-regular fa-copy"></i> Copy</button>
                <button id="downloadBtn" class="secondary-btn"><i class="fa-solid fa-download"></i> Download .txt</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const urlInput = document.getElementById('urlInput');
        const colorAmountInput = document.getElementById('colorAmount');
        const processBtn = document.getElementById('processBtn');
        const statusSpan = document.getElementById('status');
        
        const canvasSource = document.getElementById('canvasSource');
        const ctxSource = canvasSource.getContext('2d');
        const canvasResult = document.getElementById('canvasResult');
        const ctxResult = canvasResult.getContext('2d');
        
        const outputCode = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let generatedString = "";

        // UI Helper: Update file name when selected
        fileInput.addEventListener('change', function() {
            if(this.files && this.files.length > 0) {
                fileNameDisplay.textContent = this.files[0].name;
                fileNameDisplay.style.color = "var(--primary)";
            } else {
                fileNameDisplay.textContent = "Click or Drag image here";
                fileNameDisplay.style.color = "var(--text-muted)";
            }
        });

        processBtn.addEventListener('click', () => {
            const colorVal = colorAmountInput.value.trim().toLowerCase();
            
            statusSpan.textContent = "⏳ Loading image...";
            statusSpan.style.color = "var(--text-main)";

            const img = new Image();
            img.crossOrigin = "Anonymous";

            img.onload = () => {
                // Use the image's natural dimensions
                processImage(img, img.width, img.height, colorVal);
            };

            img.onerror = () => {
                statusSpan.textContent = "❌ Error loading image (CORS or invalid URL).";
                statusSpan.style.color = "#ef4444";
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput.value) {
                img.src = urlInput.value;
            } else {
                statusSpan.textContent = "⚠️ Please select a file or enter a URL.";
                statusSpan.style.color = "#ef4444";
            }
        });

        function processImage(img, width, height, colorMode) {
            statusSpan.textContent = "⚙️ Processing...";
            
            // Resize logic
            canvasSource.width = width;
            canvasSource.height = height;
            canvasResult.width = width;
            canvasResult.height = height;

            ctxSource.imageSmoothingEnabled = false;
            ctxSource.drawImage(img, 0, 0, width, height);

            const imageData = ctxSource.getImageData(0, 0, width, height);
            const pixels = imageData.data; 
            const pixelCount = width * height;

            let rgbPixels = [];
            for (let i = 0; i < pixelCount; i++) {
                rgbPixels.push([pixels[i * 4], pixels[i * 4 + 1], pixels[i * 4 + 2]]);
            }

            let finalPixels = rgbPixels;

            // K-Means++ Logic
            if (colorMode !== 'full') {
                const k = parseInt(colorMode);
                if (!isNaN(k) && k > 0 && k < pixelCount) {
                    statusSpan.textContent = `🎨 Quantizing to ${k} colors...`;
                    setTimeout(() => {
                        finalPixels = runKMeans(rgbPixels, k);
                        finalizeOutput(finalPixels, width, height);
                    }, 50); // Slight delay to allow UI update
                    return;
                }
            }

            finalizeOutput(finalPixels, width, height);
        }

        function finalizeOutput(rgbPixels, width, height) {
            const resultImageData = ctxResult.createImageData(width, height);
            for (let i = 0; i < rgbPixels.length; i++) {
                resultImageData.data[i * 4] = rgbPixels[i][0];
                resultImageData.data[i * 4 + 1] = rgbPixels[i][1];
                resultImageData.data[i * 4 + 2] = rgbPixels[i][2];
                resultImageData.data[i * 4 + 3] = 255; 
            }
            ctxResult.putImageData(resultImageData, 0, 0);

            const strParts = rgbPixels.map(p => `${p[0]},${p[1]},${p[2]}`);
            generatedString = strParts.join(';');
            
            outputCode.value = generatedString;
            statusSpan.textContent = "✅ Done!";
            statusSpan.style.color = "var(--success)";
        }

        // --- K-Means++ Implementation ---
        function runKMeans(pixels, k) {
            let centroids = [];
            centroids.push(pixels[Math.floor(Math.random() * pixels.length)]);

            for (let c = 1; c < k; c++) {
                let distances = [];
                let sumDistSq = 0;
                
                for (let i = 0; i < pixels.length; i++) {
                    let minD = Infinity;
                    for (let j = 0; j < centroids.length; j++) {
                        const d = distSq(pixels[i], centroids[j]);
                        if (d < minD) minD = d;
                    }
                    distances[i] = minD;
                    sumDistSq += minD;
                }

                let r = Math.random() * sumDistSq;
                let index = -1;
                for (let i = 0; i < distances.length; i++) {
                    r -= distances[i];
                    if (r <= 0) {
                        index = i;
                        break;
                    }
                }
                if (index === -1) index = distances.length - 1;
                centroids.push(pixels[index]);
            }

            const maxIterations = 20;
            let assignments = new Uint8Array(pixels.length);
            if (k > 255) assignments = new Uint16Array(pixels.length);

            for (let iter = 0; iter < maxIterations; iter++) {
                let changed = false;
                let sums = Array(k).fill(0).map(() => [0, 0, 0]);
                let counts = Array(k).fill(0);

                for (let i = 0; i < pixels.length; i++) {
                    let minD = Infinity;
                    let bestC = 0;
                    for (let j = 0; j < k; j++) {
                        const d = distSq(pixels[i], centroids[j]);
                        if (d < minD) {
                            minD = d;
                            bestC = j;
                        }
                    }
                    if (assignments[i] !== bestC) {
                        assignments[i] = bestC;
                        changed = true;
                    }
                    
                    sums[bestC][0] += pixels[i][0];
                    sums[bestC][1] += pixels[i][1];
                    sums[bestC][2] += pixels[i][2];
                    counts[bestC]++;
                }

                if (!changed) break;

                for (let j = 0; j < k; j++) {
                    if (counts[j] > 0) {
                        centroids[j] = [
                            Math.floor(sums[j][0] / counts[j]),
                            Math.floor(sums[j][1] / counts[j]),
                            Math.floor(sums[j][2] / counts[j])
                        ];
                    }
                }
            }
            return pixels.map((_, i) => centroids[assignments[i]]);
        }

        function distSq(p1, p2) {
            return (p1[0] - p2[0])**2 + (p1[1] - p2[1])**2 + (p1[2] - p2[2])**2;
        }

        copyBtn.addEventListener('click', () => {
            if (!generatedString) return;
            outputCode.select();
            document.execCommand('copy');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(generatedString);
            }
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            setTimeout(() => copyBtn.innerHTML = originalText, 2000);
        });

        downloadBtn.addEventListener('click', () => {
            if (!generatedString) return;
            const blob = new Blob([generatedString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Output_RGB.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
