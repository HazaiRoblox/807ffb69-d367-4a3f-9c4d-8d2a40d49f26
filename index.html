<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandyzHub RGB Generator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #252525;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.1);
            width: 90%;
            max-width: 800px;
            border: 1px solid #333;
        }
        h1 { color: #00ffaa; margin-bottom: 5px; text-align: center; }
        p { color: #888; text-align: center; margin-top: 0; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: #303030;
            padding: 15px;
            border-radius: 10px;
        }
        
        input[type="file"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            background: #404040;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #00ffaa;
            color: #1a1a1a;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { background-color: #00cc88; }
        
        .preview-area {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .preview-box {
            text-align: center;
        }
        .preview-box h3 { font-size: 14px; color: #aaa; }
        img, canvas {
            max-width: 300px;
            max-height: 300px;
            border: 2px solid #444;
            background: #000;
        }
        
        textarea {
            width: 100%;
            height: 100px;
            background: #111;
            color: #00ffaa;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
            resize: vertical;
            font-family: monospace;
            font-size: 10px;
            box-sizing: border-box;
        }
        
        .stats {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CandyzHub Generator</h1>
    <p>Draw & Donate RGB Converter</p>

    <div class="controls">
        <div>
            <label>Upload Image</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div>
            <label>Or Image URL</label>
            <input type="text" id="urlInput" placeholder="https://...">
        </div>
        <div style="grid-column: span 2;">
            <label>Target Resolution</label>
            <select id="resSelect">
                <option value="700">700x700 (490,000 pixels)</option>
                <option value="500">500x500 (250,000 pixels)</option>
                <option value="200">200x200 (40,000 pixels)</option>
                <option value="100">100x100 (10,000 pixels)</option>
                <option value="50">50x50 (2,500 pixels)</option>
            </select>
        </div>
        <div style="grid-column: span 2;">
            <button onclick="processImage()">Process & Generate Code</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-box">
            <h3>Original</h3>
            <img id="originalPreview" src="" alt="No Image">
        </div>
        <div class="preview-box">
            <h3>Result (Pixelated)</h3>
            <canvas id="canvasPreview"></canvas>
        </div>
    </div>

    <textarea id="outputData" placeholder="RGB Data string will appear here..." readonly></textarea>
    <div class="stats" id="statusText">Waiting for input...</div>
    <button onclick="copyToClipboard()" style="background-color: #444; color: white; margin-top: 5px;">Copy to Clipboard</button>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const resSelect = document.getElementById('resSelect');
    const originalPreview = document.getElementById('originalPreview');
    const canvas = document.getElementById('canvasPreview');
    const ctx = canvas.getContext('2d');
    const outputData = document.getElementById('outputData');
    const statusText = document.getElementById('statusText');

    let currentImage = new Image();
    currentImage.crossOrigin = "Anonymous";

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    urlInput.addEventListener('change', function(e) {
        if (e.target.value) {
            currentImage.src = e.target.value;
        }
    });

    currentImage.onload = function() {
        originalPreview.src = currentImage.src;
        statusText.innerText = "Image loaded. Click Process.";
    }

    function processImage() {
        if (!currentImage.src) {
            alert("Please load an image first.");
            return;
        }

        const size = parseInt(resSelect.value);
        canvas.width = size;
        canvas.height = size;

        // Draw and resize
        ctx.imageSmoothingEnabled = false; // Pixel art style
        ctx.drawImage(currentImage, 0, 0, size, size);

        // Get Data
        const imageData = ctx.getImageData(0, 0, size, size);
        const data = imageData.data;
        let rgbStrings = [];

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            // Alpha data[i+3] is ignored
            rgbStrings.push(`${r},${g},${b}`);
        }

        const finalString = rgbStrings.join(';');
        outputData.value = finalString;
        statusText.innerText = `Generated ${rgbStrings.length} pixels for ${size}x${size} resolution.`;
    }

    function copyToClipboard() {
        outputData.select();
        document.execCommand('copy');
        alert("Copied to clipboard!");
    }
</script>

</body>
</html>
