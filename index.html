<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Canvas Image Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .dimension-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .preview-container.active {
            display: block;
        }
        
        #preview {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .status.active {
            display: block;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
            color: #666;
            font-weight: 600;
            transition: color 0.3s;
            margin: 0;
            border-radius: 0;
        }
        
        .tab:hover {
            transform: none;
            box-shadow: none;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Roblox Canvas Converter</h1>
        <p class="subtitle">Convert images to Roblox canvas format</p>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('url')">Image URL</button>
            <button class="tab" onclick="switchTab('file')">Upload File</button>
        </div>
        
        <div id="urlTab" class="tab-content active">
            <div class="input-group">
                <label for="imageUrl">Image URL (Raw URL)</label>
                <input type="text" id="imageUrl" placeholder="https://example.com/image.png">
            </div>
        </div>
        
        <div id="fileTab" class="tab-content">
            <div class="input-group">
                <label for="imageFile">Select Image File</label>
                <input type="file" id="imageFile" accept="image/*">
            </div>
        </div>
        
        <div class="dimension-inputs">
            <div class="input-group">
                <label for="targetWidth">Canvas Width</label>
                <input type="number" id="targetWidth" value="700" min="1" max="2000">
            </div>
            <div class="input-group">
                <label for="targetHeight">Canvas Height</label>
                <input type="number" id="targetHeight" value="700" min="1" max="2000">
            </div>
        </div>
        
        <button onclick="convertImage()">Convert Image</button>
        
        <div class="preview-container" id="previewContainer">
            <h3>Preview (Resized)</h3>
            <canvas id="preview"></canvas>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        let currentTab = 'url';
        
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status active ' + type;
        }
        
        function loadImageFromUrl(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Failed to load image from URL'));
                img.src = url;
            });
        }
        
        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('Failed to load image from file'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsDataURL(file);
            });
        }
        
        async function convertImage() {
            try {
                showStatus('Loading image...', 'info');
                
                let img;
                
                if (currentTab === 'url') {
                    const url = document.getElementById('imageUrl').value.trim();
                    if (!url) {
                        showStatus('Please enter an image URL', 'error');
                        return;
                    }
                    img = await loadImageFromUrl(url);
                } else {
                    const fileInput = document.getElementById('imageFile');
                    if (!fileInput.files || !fileInput.files[0]) {
                        showStatus('Please select an image file', 'error');
                        return;
                    }
                    img = await loadImageFromFile(fileInput.files[0]);
                }
                
                const targetWidth = parseInt(document.getElementById('targetWidth').value);
                const targetHeight = parseInt(document.getElementById('targetHeight').value);
                
                if (!targetWidth || !targetHeight || targetWidth < 1 || targetHeight < 1) {
                    showStatus('Please enter valid dimensions', 'error');
                    return;
                }
                
                showStatus('Processing image...', 'info');
                
                // Create canvas and resize image
                const canvas = document.getElementById('preview');
                const ctx = canvas.getContext('2d');
                
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                
                // Use nearest neighbor for pixel art
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                
                // Show preview
                document.getElementById('previewContainer').classList.add('active');
                
                // Get pixel data
                const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
                const pixels = imageData.data;
                
                const outputData = [];
                
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    // Skip alpha channel (pixels[i + 3])
                    
                    outputData.push(`${r},${g},${b}`);
                }
                
                const finalString = outputData.join(';');
                
                // Create and download file
                const blob = new Blob([finalString], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Output_RGB.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showStatus(
                    `Success! Processing ${outputData.length} pixels. File downloaded as 'Output_RGB.txt'. ` +
                    `Move this file to your Executor's 'workspace' folder.`,
                    'success'
                );
                
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
