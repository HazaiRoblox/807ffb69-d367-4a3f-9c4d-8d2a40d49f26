<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to RGB String Converter</title>
</head>
<body>

    <h1>Image to RGB String Converter</h1>

    <div>
        <h3>1. Input</h3>
        <label>File: <input type="file" id="fileInput" accept="image/*"></label>
        <br><br>
        <label>OR Image URL: <input type="text" id="urlInput" placeholder="https://example.com/image.png"></label>
    </div>

    <div>
        <h3>2. Configuration</h3>
        <label>Target Width: <input type="number" id="targetWidth" value="100"></label>
        <br>
        <label>Target Height: <input type="number" id="targetHeight" value="100"></label>
        <br>
        <label>Color Amount: <input type="text" id="colorAmount" value="full" placeholder="e.g. 16 or 'full'"></label>
        <br><br>
        <button id="processBtn">Process Image</button>
        <span id="status" style="margin-left: 10px; font-weight: bold;"></span>
    </div>

    <div>
        <h3>3. Preview</h3>
        <div style="display: flex; gap: 20px;">
            <div>
                <p>Before (Resized):</p>
                <canvas id="canvasSource" style="border: 1px solid black;"></canvas>
            </div>
            <div>
                <p>After (Processed):</p>
                <canvas id="canvasResult" style="border: 1px solid black;"></canvas>
            </div>
        </div>
    </div>

    <div>
        <h3>4. Output</h3>
        <textarea id="outputCode" rows="10" cols="80" readonly placeholder="Result string will appear here..."></textarea>
        <br>
        <button id="copyBtn">Copy Code</button>
        <button id="downloadBtn">Download .txt</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const urlInput = document.getElementById('urlInput');
        const targetWidthInput = document.getElementById('targetWidth');
        const targetHeightInput = document.getElementById('targetHeight');
        const colorAmountInput = document.getElementById('colorAmount');
        const processBtn = document.getElementById('processBtn');
        const statusSpan = document.getElementById('status');
        
        const canvasSource = document.getElementById('canvasSource');
        const ctxSource = canvasSource.getContext('2d');
        const canvasResult = document.getElementById('canvasResult');
        const ctxResult = canvasResult.getContext('2d');
        
        const outputCode = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let generatedString = "";

        processBtn.addEventListener('click', () => {
            const width = parseInt(targetWidthInput.value);
            const height = parseInt(targetHeightInput.value);
            const colorVal = colorAmountInput.value.trim().toLowerCase();
            
            if (!width || !height) {
                alert("Please specify valid dimensions.");
                return;
            }

            statusSpan.textContent = "Loading image...";

            const img = new Image();
            img.crossOrigin = "Anonymous";

            img.onload = () => {
                processImage(img, width, height, colorVal);
            };

            img.onerror = () => {
                statusSpan.textContent = "Error loading image (CORS or invalid URL).";
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput.value) {
                img.src = urlInput.value;
            } else {
                statusSpan.textContent = "Please select a file or enter a URL.";
            }
        });

        function processImage(img, width, height, colorMode) {
            statusSpan.textContent = "Processing...";
            
            // Resize logic
            canvasSource.width = width;
            canvasSource.height = height;
            canvasResult.width = width;
            canvasResult.height = height;

            // Draw resized image (Nearest Neighbor simulation via smoothing=false usually, 
            // but standard drawImage is sufficient for basic resizing. 
            // For strict nearest neighbor on downscale, we rely on browser implementation or pixel manipulation, 
            // but standard drawImage is standard for this scope).
            ctxSource.imageSmoothingEnabled = false;
            ctxSource.drawImage(img, 0, 0, width, height);

            const imageData = ctxSource.getImageData(0, 0, width, height);
            const pixels = imageData.data; // [r, g, b, a, r, g, b, a...]
            const pixelCount = width * height;

            // Prepare data for processing (RGB only)
            let rgbPixels = [];
            for (let i = 0; i < pixelCount; i++) {
                rgbPixels.push([pixels[i * 4], pixels[i * 4 + 1], pixels[i * 4 + 2]]);
            }

            let finalPixels = rgbPixels;

            // K-Means++ Logic
            if (colorMode !== 'full') {
                const k = parseInt(colorMode);
                if (!isNaN(k) && k > 0 && k < pixelCount) {
                    statusSpan.textContent = `Quantizing to ${k} colors...`;
                    // Allow UI to update before heavy calculation
                    setTimeout(() => {
                        finalPixels = runKMeans(rgbPixels, k);
                        finalizeOutput(finalPixels, width, height);
                    }, 10);
                    return;
                }
            }

            finalizeOutput(finalPixels, width, height);
        }

        function finalizeOutput(rgbPixels, width, height) {
            // Draw Result
            const resultImageData = ctxResult.createImageData(width, height);
            for (let i = 0; i < rgbPixels.length; i++) {
                resultImageData.data[i * 4] = rgbPixels[i][0];
                resultImageData.data[i * 4 + 1] = rgbPixels[i][1];
                resultImageData.data[i * 4 + 2] = rgbPixels[i][2];
                resultImageData.data[i * 4 + 3] = 255; // Alpha full
            }
            ctxResult.putImageData(resultImageData, 0, 0);

            // Generate String
            const strParts = rgbPixels.map(p => `${p[0]},${p[1]},${p[2]}`);
            generatedString = strParts.join(';');
            
            outputCode.value = generatedString;
            statusSpan.textContent = "Done!";
        }

        // --- K-Means++ Implementation ---
        function runKMeans(pixels, k) {
            // 1. Initialization (K-Means++)
            let centroids = [];
            // Pick first centroid randomly
            centroids.push(pixels[Math.floor(Math.random() * pixels.length)]);

            for (let c = 1; c < k; c++) {
                let distances = [];
                let sumDistSq = 0;
                
                // Calculate distance squared to nearest existing centroid for all pixels
                for (let i = 0; i < pixels.length; i++) {
                    let minD = Infinity;
                    for (let j = 0; j < centroids.length; j++) {
                        const d = distSq(pixels[i], centroids[j]);
                        if (d < minD) minD = d;
                    }
                    distances[i] = minD;
                    sumDistSq += minD;
                }

                // Select next centroid with probability proportional to distance squared
                let r = Math.random() * sumDistSq;
                let index = -1;
                for (let i = 0; i < distances.length; i++) {
                    r -= distances[i];
                    if (r <= 0) {
                        index = i;
                        break;
                    }
                }
                if (index === -1) index = distances.length - 1;
                centroids.push(pixels[index]);
            }

            // 2. Iteration
            const maxIterations = 20;
            let assignments = new Uint8Array(pixels.length); // Assuming k < 256, else use Uint16Array
            if (k > 255) assignments = new Uint16Array(pixels.length);

            for (let iter = 0; iter < maxIterations; iter++) {
                let changed = false;
                let sums = Array(k).fill(0).map(() => [0, 0, 0]);
                let counts = Array(k).fill(0);

                // Assignment Step
                for (let i = 0; i < pixels.length; i++) {
                    let minD = Infinity;
                    let bestC = 0;
                    for (let j = 0; j < k; j++) {
                        const d = distSq(pixels[i], centroids[j]);
                        if (d < minD) {
                            minD = d;
                            bestC = j;
                        }
                    }
                    if (assignments[i] !== bestC) {
                        assignments[i] = bestC;
                        changed = true;
                    }
                    
                    sums[bestC][0] += pixels[i][0];
                    sums[bestC][1] += pixels[i][1];
                    sums[bestC][2] += pixels[i][2];
                    counts[bestC]++;
                }

                if (!changed) break;

                // Update Step
                for (let j = 0; j < k; j++) {
                    if (counts[j] > 0) {
                        centroids[j] = [
                            Math.floor(sums[j][0] / counts[j]),
                            Math.floor(sums[j][1] / counts[j]),
                            Math.floor(sums[j][2] / counts[j])
                        ];
                    }
                }
            }

            // Map pixels to final centroids
            return pixels.map((_, i) => centroids[assignments[i]]);
        }

        function distSq(p1, p2) {
            return (p1[0] - p2[0])**2 + (p1[1] - p2[1])**2 + (p1[2] - p2[2])**2;
        }

        // --- Output Actions ---
        copyBtn.addEventListener('click', () => {
            if (!generatedString) return;
            outputCode.select();
            document.execCommand('copy'); // Fallback for older browsers
            if (navigator.clipboard) {
                navigator.clipboard.writeText(generatedString);
            }
            alert("Copied to clipboard!");
        });

        downloadBtn.addEventListener('click', () => {
            if (!generatedString) return;
            const blob = new Blob([generatedString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Output_RGB.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

    </script>
</body>
</html>
